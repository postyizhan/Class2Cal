# 复制为 config.toml 后按实际情况填写，或直接跑 `class2cal setup` 交互生成。
# 密码不在这里 —— 统一认证密码和 Apple 应用专用密码都只存 macOS Keychain。

[sso]
# 统一认证账号（学号）
username = "20240001"

[schedule]
# 课表卡片坐标。未登录状态拿不到，跑 `class2cal probe` 探明后自动写入。
card_wid = ""
card_id = ""
# 抓取窗口：当前周 + 后 N 周。学校分批排课，窗口往前铺就能接住后续批次。
weeks_ahead = 4

# 课表接口的入参字段名，probe 拿到真实样本后按需填。
[schedule.field_map]
# start_date = "startDate"
# end_date = "endDate"

# 节次 -> [开始, 结束]。留空则用内置的武进校区作息表（见 timetable.py）。
# 仅当某条记录只给了节次号、没给具体时间时才会用到。
[schedule.period_times]

# 自习时段：学校教务系统只排正课，晚自习要靠这里补。
# 填一次就存在本地，之后每次同步照用。`class2cal setup` 也会问这两行。
# 有正课和这个时段重叠的那天，只写正课，不写自习。
[study]
enabled = false
# days = ["mon", "wed", "sun"]   # 也认 周一..周日 / 1..7
# start = "19:00"
# end = "21:30"
# title = "晚自习"                # 可选，默认 晚自习
# location = "图书馆"             # 可选

# 要更细（多条时段、单双周、学期范围、跳过某些日期）再加：
# [[study.slots]]
# title = "晚自习"
# days = ["mon", "tue", "wed", "thu", "sun"]
# start = "18:00"
# end = "21:00"
# parity = "all"                # all / odd / even（按 ISO 周次）
# from = "2026-09-01"           # 可选，学期开始
# to = "2027-01-15"             # 可选，学期结束
# skip = ["2026-10-01"]         # 可选，跳过这些日期

[calendar]
# iCloud 账号（Mac 上登录的那个 Apple ID）
apple_id = "you@example.com"
# 目标日历名。工具只动自己打了 c2c. UID 前缀的事件，不碰你手录的。
calendar_name = "学校课程"
caldav_url = "https://caldav.icloud.com"
